packages:
  - packages/*
  - themes/*
  - tools/*

configDependencies:
  pnpm-plugin-nice-move: latest

# 重复依赖集中到 catalog：同一份版本只写一次，
# 各工作区包的 dependencies / peerDependencies 用 `catalog:` 引用，便于统一升降级。
#
# 只放**外部**依赖：本仓库自己的工作区包（`@show-docs/*`）不进这里 —— `pnpm lint:version` 用的
# 那份 preset 把「Pin pnpm workspace」排在 catalog 那几组前面，一个名字同时是工作区包又在 catalog 里时，
# 它要的是各包 `package.json` 里直接写 `workspace:^`，写 `catalog:` 会被判成 DiffersToPin。
catalog:
  '@docusaurus/core': '^3.9.2'
  '@docusaurus/theme-common': '^3.9.2'
  '@docusaurus/types': '^3.9.2'
  react: '~18.3.1'
  webpack: '^5.112.2'

# `@stoplight/mosaic` 把 `@types/react: ^17` 写成**依赖**（不是 peer），于是同一张图里能同时存在
# 17 与 18 两份 `@types/react`。Docusaurus 那一串包按 peer 分组存放，peer 里就有这一格，
# 两份 `@types/react` 因此把 `@docusaurus/plugin-content-docs` 与 `@docusaurus/theme-common` 各裂成
# 两份物理副本。副本多一个就出这种事：站点的 `ColorModeProvider` 用了一份 `theme-common`，
# `theme-stoplight` 那层里 `useColorMode` 读的是另一份，两个 `createContext` 对不上，
# `pnpm build` 静态渲染 `/packages/theme-stoplight/docs/stoplight-demo` 直接抛 `ReactContextError`
# （构建全绿才会露出来的一格）。
# 钉到根上那一条版本线，peer 分组就只剩一种，图里只留一份副本。
#
# 这条不是预防性的整齐癖，是接进 `theme-scalar` 时才露出来的：`@scalar/api-reference` 那一串依赖
# 把 peer 分组重新洗了一遍，洗完之后 `theme-stoplight` 独自在另一份副本里。实测（清掉 webpack
# 持久缓存重建）：去掉这一格 override，`/packages/theme-stoplight/docs/stoplight-demo` 就回到上面
# 那个 `ReactContextError`；
# 加回来，五个用 `theme-common` 的工作区包全部软链到同一份，构建全绿。
overrides:
  '@types/react': ~18.3.31

# 依赖的安装脚本默认不放行，而且每个被挡住的包都要**点名表态**（true 放行 / false 拒绝），
# 否则每次 `pnpm install` 都以 `ERR_PNPM_IGNORED_BUILDS` 失败。口径只有一条：
# 这个脚本跑不跑，决定运行时能不能拿到它产出的东西 —— 要拿到的放行，纯提示的拒绝。
allowBuilds:
  # 原生绑定 / 平台二进制：脚本负责把它们放到位，不跑就在运行时抛错。
  '@parcel/watcher': true
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  'esbuild': true
  'sharp': true
  'tree-sitter': true
  'tree-sitter-json': true
  'unrs-resolver': true
  # 只有横幅 / 遥测 / git hooks，或本身就是可选加速（`bufferutil` 缺了 ws 会退回纯 JS 路径）：
  # 跑与不跑都不影响产物。
  '@fontsource-variable/barlow': false
  '@scarf/scarf': false
  bottleneck: false
  'bufferutil': false
  'core-js': false
  cosmiconfig: false
  infima: false
  'is-ci': false
  'tesseract.js': false
  'tuf-js': false

shamefullyHoist: true

# `react-dom@18.3.1` 的 Fizz 在中文串跨 2048 字节视图边界时，会把整块视图连同尾部的零填充一起写进
# 输出流 —— 静态页里因此夹着 NUL，浏览器把 NUL 显示成 `��`（viewer 的标题就多了这个前缀）。
# 补丁只把那一行改成 `subarray(0, writtenBytes)`，与上游 React 19 的写法一致；升级到 19 后可整块删掉。
patchedDependencies:
  react-dom@18.3.1: patches/react-dom@18.3.1.patch
