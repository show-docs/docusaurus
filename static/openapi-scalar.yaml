openapi: 3.0.3
info:
  version: 1.0.0
  title: Scalar 演示 API
  description: >
    这份文档只给 `docs/scalar-demo.md` 那一页用：frontmatter 写

    `oas3: /openapi-scalar.yaml`，构建时它从 `static/` 复制到站点根，浏览器端按这个地址取。

    Stoplight 与 Redoc 的示例页各用自己那份（`openapi-stoplight.yaml` /
    `openapi-redoc.yaml`），

    三页不再共用。
servers:
  - url: https://api.example.com/v1
paths:
  /orders:
    get:
      operationId: listOrders
      summary: 列出订单
      tags:
        - orders
      parameters:
        - name: limit
          description: 返回条数上限
          in: query
          schema:
            type: integer
            maximum: 100
            default: 20
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Order'
                type: array
        default:
          description: 出错
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createOrder
      summary: 新建订单
      tags:
        - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDraft'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: 出错
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: 取单个订单
      tags:
        - orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderDraft'
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            id:
              type: string
            status:
              type: string
              enum:
                - pending
                - paid
                - shipped
                - cancelled
          required:
            - id
            - status
            - createdAt
    OrderDraft:
      type: object
      properties:
        item:
          description: 商品名
          type: string
        quantity:
          type: integer
          minimum: 1
      required:
        - item
        - quantity
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-Api-Key
      in: header
security:
  - apiKey: []
tags:
  - name: orders
    description: 订单的增删改查
