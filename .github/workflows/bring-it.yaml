name: bring-it

on:
  push:
    branches:
      - main
  # 只挂 `push` 时，PR 上的每一道闸门都要等合进 main 才跑一次；改成两边都跑，
  # 判红落在 PR 上，而不是落在 main 的历史里。
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  test:
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
        node:
          - current
          - lts/*
          - lts/-1
        exclude:
          - os: ubuntu-latest
            node: lts/*
    runs-on: ${{ matrix.os }}
    steps:
      - name: Run
        uses: airkro/bring-it@actions-oidc
        with:
          node-version: ${{ matrix.node }}

  # 浏览器侧那批判据（跨 iframe 投递、渲染器、样式边界）只在真浏览器里有意义，而
  # `verify` 一路是静态回读，覆盖不到。只装 chromium：`playwright.config.mts` 只有这一个 project。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 全历史，不能用默认的浅检出（depth 1）：差异视图示例页要比的是
          # `packages/README.md` 的**上一个版本**，那要 git 历史。浅检出里只有一次提交，
          # 工作区又是干净的，比不出来 —— 那一页等于没开这个功能，差异视图整个不渲染
          # （`theme-diff` 的 loader 走的是「这份文件上一次被提交的那一版」与「工作区这一份」
          # 两端比，缺了历史就没有上一端）。实测：depth 1 的检出里
          # `git log --follow -n 2 -- packages/README.md` 只有一条、且工作区无改动。
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  publish:
    needs: [verify, test, e2e]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Run
        uses: airkro/bring-it@actions-oidc
